# OpenAPI 3.1 skeleton for the new admin routes.
# This is a Phase 0 artifact: expand schemas to match the implementation and
# validate with an OpenAPI linter in CI. Gateway routes (/v1/*) are documented
# separately because they are OpenAI/Anthropic-compatible.
openapi: 3.1.0
info:
  title: OC Router Admin API
  version: 0.1.0
  description: >
    Local admin API for usage, proxy supply, model metadata, and token savers.
    All routes require the admin session cookie; mutating routes also require
    the CSRF header. Never expose this listener to an untrusted network.
servers:
  - url: http://127.0.0.1:8081
security:
  - cookieAuth: []
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: oc_router_session
  parameters:
    Csrf:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string }
    Provider:
      name: provider
      in: query
      schema: { type: string }
    Model:
      name: model
      in: query
      schema: { type: string }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: object, additionalProperties: true }
    UsageTotals:
      type: object
      properties:
        requests: { type: integer, minimum: 0 }
        success: { type: integer, minimum: 0 }
        errors: { type: integer, minimum: 0 }
        input_tokens: { type: integer, minimum: 0 }
        cached_tokens: { type: integer, minimum: 0 }
        cache_write_tokens: { type: integer, minimum: 0 }
        output_tokens: { type: integer, minimum: 0 }
        reasoning_tokens: { type: integer, minimum: 0 }
        total_tokens: { type: integer, minimum: 0 }
        estimated_cost_usd: { type: number, minimum: 0, nullable: true }
        currency: { type: string, default: USD }
        usage_coverage: { type: number, minimum: 0, maximum: 1 }
        cost_coverage: { type: number, minimum: 0, maximum: 1 }
    UsageGroup:
      allOf:
        - $ref: '#/components/schemas/UsageTotals'
        - type: object
          properties:
            provider: { type: string }
            model: { type: string }
            endpoint: { type: string }
            day: { type: string }
            server_key_fp: { type: string }
            pricing_source: { type: string, enum: [manual, models.dev, opencode, hardcoded, none] }
            usage_source: { type: string, enum: [provider, partial, unavailable] }
    UsageSummary:
      type: object
      required: [range, totals, groups]
      properties:
        source: { type: string, enum: [raw, rollup, mixed] }
        truncated: { type: boolean }
        range:
          type: object
          properties:
            from: { type: string, format: date-time }
            to: { type: string, format: date-time }
            timezone: { type: string, const: UTC }
        totals: { $ref: '#/components/schemas/UsageTotals' }
        groups:
          type: array
          items: { $ref: '#/components/schemas/UsageGroup' }
    ModelCatalogRow:
      type: object
      required: [id, provider, effective]
      properties:
        id: { type: string }
        provider: { type: string }
        discovered:
          type: object
          additionalProperties: true
        override:
          type: object
          nullable: true
          additionalProperties: true
        effective:
          type: object
          required: [context, output]
          properties:
            context: { type: integer, minimum: 1 }
            input: { type: integer, minimum: 1 }
            output: { type: integer, minimum: 1 }
        above_discovered: { type: boolean }
        hidden: { type: boolean }
    ModelOverride:
      type: object
      properties:
        context: { type: integer, minimum: 1, maximum: 10000000 }
        input: { type: integer, minimum: 1, maximum: 10000000 }
        output: { type: integer, minimum: 1, maximum: 10000000 }
        hidden: { type: boolean }
        cost:
          type: object
          properties:
            input: { type: number, minimum: 0 }
            output: { type: number, minimum: 0 }
            cache_read: { type: number, minimum: 0 }
            cache_write: { type: number, minimum: 0 }
        capabilities: { type: object, additionalProperties: true }
        aliases: { type: array, items: { type: string } }
    Proxy:
      type: object
      required: [id, scheme, host, port, status]
      properties:
        id: { type: string }
        scheme: { type: string, enum: [http, https, socks5, socks5h] }
        host: { type: string }
        port: { type: integer, minimum: 1, maximum: 65535 }
        has_auth: { type: boolean }
        source: { type: string }
        status: { type: string, enum: [unknown, good, bad, quota, timeout] }
        judge_latency_ms: { type: integer, minimum: 0 }
        judge_klass: { type: string, enum: [elite, anonymous] }
        egress: { type: string }
        country: { type: string }
        probe_status: { type: string, enum: [pass, quota, auth, transport, timeout, unknown] }
        last_judged_at: { type: string, format: date-time, nullable: true }
        last_probed_at: { type: string, format: date-time, nullable: true }
        in_use: { type: boolean }
        cooldown_until: { type: string, format: date-time, nullable: true }
        enabled: { type: boolean }
        priority: { type: integer }
    ProxySource:
      type: object
      required: [id, name, kind, enabled]
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string, enum: [http-text, http-json, manual] }
        url: { type: string, description: Masked if it contains a secret }
        enabled: { type: boolean }
        parser: { type: string, enum: [host:port, scheme://host:port, json] }
        default_scheme: { type: string, enum: [http, https, socks5, socks5h] }
        headers: { type: object, additionalProperties: { type: string } }
        last_fetch: { type: string, format: date-time, nullable: true }
    ProxyJob:
      type: object
      required: [id, kind, state, progress]
      properties:
        id: { type: string }
        kind: { type: string, enum: [fetch, judge, probe, full] }
        state: { type: string, enum: [queued, running, succeeded, failed, canceled] }
        stage: { type: string }
        progress:
          type: object
          properties:
            done: { type: integer, minimum: 0 }
            total: { type: integer, minimum: 0 }
        counters: { type: object, additionalProperties: true }
        error: { type: string, nullable: true }
    TokenSavers:
      type: object
      properties:
        rtk: { type: object, additionalProperties: true }
        headroom: { type: object, additionalProperties: true }
        tools:
          type: object
          additionalProperties:
            type: string
            nullable: true
    ToolDetection:
      type: object
      additionalProperties:
        type: object
        properties:
          path: { type: string, nullable: true }
          version: { type: string, nullable: true }
  responses:
    Unauthorized:
      description: Missing or invalid admin session
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: A conflicting job or state
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
paths:
  /api/usage/summary:
    get:
      summary: Aggregated usage
      parameters:
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: group_by, in: query, schema: { type: string, enum: [provider, model, provider_model, endpoint, day, server_key] } }
        - { name: sort, in: query, schema: { type: string } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc] } }
        - { name: provider, in: query, schema: { type: string } }
        - { name: model, in: query, schema: { type: string } }
        - { name: endpoint, in: query, schema: { type: string } }
        - { name: tier, in: query, schema: { type: string } }
        - { name: server_key, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: integer } }
        - { name: outcome, in: query, schema: { type: string } }
      responses:
        '200':
          description: Summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsageSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/usage/events:
    get:
      summary: Paginated usage events (metadata only)
      parameters:
        - { name: before_id, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer, maximum: 500 } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: provider, in: query, schema: { type: string } }
        - { name: model, in: query, schema: { type: string } }
        - { name: endpoint, in: query, schema: { type: string } }
        - { name: tier, in: query, schema: { type: string } }
        - { name: server_key, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: integer } }
        - { name: outcome, in: query, schema: { type: string } }
      responses:
        '200': { description: Events }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/usage/export:
    get:
      summary: Export usage as CSV or JSON
      parameters:
        - { name: format, in: query, required: true, schema: { type: string, enum: [csv, json] } }
      responses:
        '200': { description: Export }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/usage/timeseries:
    get:
      summary: Daily usage totals
      parameters:
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: provider, in: query, schema: { type: string } }
        - { name: model, in: query, schema: { type: string } }
        - { name: endpoint, in: query, schema: { type: string } }
        - { name: tier, in: query, schema: { type: string } }
        - { name: server_key, in: query, schema: { type: string } }
      responses:
        '200': { description: Daily points }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/usage/backup:
    post:
      summary: Back up the usage database beside it
      parameters:
        - $ref: '#/components/parameters/Csrf'
      responses:
        '200': { description: Backup path }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { description: Usage database disabled }
  /api/models/catalog:
    get:
      summary: Merged model catalog
      responses:
        '200':
          description: Catalog
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ModelCatalogRow' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/models/overrides/{provider}/{model}:
    put:
      summary: Set or replace a model override
      security:
        - cookieAuth: []
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string } }
        - { name: model, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModelOverride' }
      responses:
        '200': { description: Updated catalog row }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      summary: Remove a model override
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string } }
        - { name: model, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/Csrf'
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/models/opencode-config:
    get:
      summary: Generate a merge-safe OpenCode V2 provider snippet
      parameters:
        - { name: compat, in: query, schema: { type: string, enum: [v1, v2], default: v2 } }
        - { name: format, in: query, schema: { type: string, enum: [snippet, json] } }
      responses:
        '200': { description: Snippet or JSON }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/proxies:
    get:
      summary: List proxies (no credentials)
      responses:
        '200':
          description: Proxies
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Proxy' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/proxies/prune:
    post:
      summary: Remove stale runtime proxy rows
      parameters:
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                older_than_days: { type: integer, minimum: 1, default: 14 }
                statuses: { type: array, items: { type: string, enum: [unknown, good, bad, quota, timeout] } }
      responses:
        '200': { description: "{deleted}" }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/proxies/{id}:
    patch:
      summary: Set runtime pool preference (never credentials or proxyfile)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                priority: { type: integer, minimum: 0, maximum: 100 }
                enabled: { type: boolean }
      responses:
        '200': { description: Updated }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Not found }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      summary: Remove one runtime proxy row
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/Csrf'
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Not found }
  /api/proxies/sources:
    get:
      summary: List configured sources
      responses:
        '200':
          description: Sources
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ProxySource' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      summary: Replace source enablement/options
      parameters:
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/ProxySource' }
      responses:
        '200': { description: Updated }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/proxies/jobs:
    post:
      summary: Start a proxy pipeline job
      parameters:
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind: { type: string, enum: [fetch, judge, probe, full] }
                sources: { type: array, items: { type: string } }
                geo: { type: boolean }
      responses:
        '202': { description: Job accepted }
        '409': { $ref: '#/components/responses/Conflict' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/proxies/jobs/{id}:
    get:
      summary: Job status
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProxyJob' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Not found }
  /api/proxies/jobs/{id}/events:
    get:
      summary: Job events (SSE)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: text/event-stream
          content:
            text/event-stream: {}
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/proxies/jobs/{id}/cancel:
    post:
      summary: Cancel a job
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/Csrf'
      responses:
        '202': { description: Cancellation requested }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/proxies/artifacts:
    get:
      summary: List generated proxy artifacts
      responses:
        '200':
          description: Artifacts
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name: { type: string }
                    path: { type: string }
                    count: { type: integer }
                    mtime: { type: string, format: date-time }
                    sha256: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/proxies/artifacts/write:
    post:
      summary: Write a known artifact from a runtime selection
      parameters:
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, selection]
              properties:
                kind: { type: string, enum: [good, simple, geo, opencode] }
                selection: { type: string, enum: [judged, probed, router] }
                statuses: { type: array, items: { type: string } }
                max: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Written
          content:
            application/json:
              schema:
                type: object
                properties:
                  path: { type: string }
                  count: { type: integer }
                  sha256: { type: string }
                  skipped_auth: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/token-savers:
    get:
      summary: Token saver status
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenSavers' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      summary: Update token saver settings
      parameters:
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TokenSavers' }
      responses:
        '200': { description: Updated }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/token-savers/headroom/install:
    post:
      summary: Install pinned Headroom in a dedicated venv
      parameters:
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                extras:
                  type: array
                  items: { type: string, enum: [code, ml] }
      responses:
        '202': { description: Install job accepted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/token-savers/headroom/{action}:
    post:
      summary: Start, stop, or restart managed Headroom
      parameters:
        - { name: action, in: path, required: true, schema: { type: string, enum: [start, stop, restart] } }
        - $ref: '#/components/parameters/Csrf'
      responses:
        '200': { description: Status }
        '400': { description: Not installed / external proxy / version mismatch }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/tools/detect:
    get:
      summary: Detect uv/pip/python/pnpm/npm/headroom
      responses:
        '200':
          description: Detection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ToolDetection' }
        '401': { $ref: '#/components/responses/Unauthorized' }
